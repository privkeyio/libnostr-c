name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  build-linux:
    # Builds third-party sources; no reason to hold a writable job token.
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: "Linux ${{ matrix.build_type }} (${{ matrix.noscrypt_name }})"
    strategy:
      matrix:
        build_type: [Debug, Release]
        noscrypt: ["OFF", "ON"]
        include:
          - noscrypt: "OFF"
            noscrypt_name: "secp256k1"
          - noscrypt: "ON"
            noscrypt_name: "noscrypt"
    
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libcjson-dev libwebsockets-dev autotools-dev autoconf libtool
          
      - name: Install secp256k1
        run: |
          git clone https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1
          git checkout 1a53f4961f337b4d166c25fce72ef0dc88806618 # v0.7.1
          ./autogen.sh
          ./configure --enable-module-schnorrsig --enable-module-extrakeys
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          
      - name: Debug matrix values
        run: |
          echo "matrix.noscrypt=${{ matrix.noscrypt }}"
          echo "matrix.noscrypt_name=${{ matrix.noscrypt_name }}"
          echo "Condition result: ${{ matrix.noscrypt == 'ON' }}"
          
      - name: Build noscrypt (if enabled)
        if: matrix.noscrypt == 'ON'
        run: |
          echo "Starting noscrypt build for matrix.noscrypt=${{ matrix.noscrypt }}"
          git clone https://github.com/VnUgE/noscrypt.git
          cd noscrypt
          # Pinned. This previously checked out whichever tag upstream had created
          # most recently, so a new noscrypt release was adopted by CI with no
          # review, in a crypto library's own dependency chain.
          git checkout 04a5c7b4d0151b9105e5afd6bc0e4dd89ac616bc # v0.1.15
          
          chmod +x ../.github/scripts/fix-noscrypt-headers.sh
          ../.github/scripts/fix-noscrypt-headers.sh . 1.1.1
          
          mkdir build && cd build
          echo "Configuring noscrypt..."
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="/usr/local" -DSECP256K1_LIB_DIR="/usr/local/lib" -DCRYPTO_LIB=openssl
          echo "Building noscrypt..."
          make -j$(nproc)
          echo "Installing noscrypt..."
          sudo make install
          sudo ldconfig
          echo "Verifying noscrypt installation..."
          pkg-config --exists noscrypt && echo "noscrypt pkg-config found" || echo "noscrypt pkg-config not found"
          ls -la /usr/local/include/noscrypt/ || echo "noscrypt headers not found"
          
      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNOSTR_FEATURE_CRYPTO_NOSCRYPT=${{ matrix.noscrypt }}
          
      - name: Build
        run: |
          cd build
          make -j$(nproc)
          
      - name: Test
        run: |
          cd build
          ctest --output-on-failure

  # The mbedTLS branches in key.c, event.c, nip44.c and nip26.c were previously
  # compiled only by build-esp-idf, which is build-only, so nothing ever executed
  # them. A self-deadlock, an unsynchronised DRBG draw and a >1024-byte
  # regression all reached main through that gap. This runs the same test suite
  # against those branches on the host.
  #
  # Host mbedTLS is 2.x and ESP-IDF ships 3.x, so this covers the logic rather
  # than the ESP toolchain. Every defect above was logic.
  build-mbedtls:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: "Linux mbedTLS crypto paths"
    # Read-only: this job builds third-party sources with sudo, so it should not
    # be able to write anything back with the job token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Otherwise the token is written into .git/config, where any later
          # step, including the third-party build below, can read it.
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libmbedtls-dev libcjson-dev libwebsockets-dev autotools-dev autoconf libtool

      - name: Install secp256k1
        run: |
          # Pinned: this is built and `sudo make install`ed, so an unpinned
          # default branch would run whatever upstream pushed, as root.
          git clone https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1
          git checkout 1a53f4961f337b4d166c25fce72ef0dc88806618 # v0.7.1
          git checkout 1a53f4961f337b4d166c25fce72ef0dc88806618 # v0.7.1
          ./autogen.sh
          ./configure --enable-module-schnorrsig --enable-module-extrakeys
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DNOSTR_FEATURE_CRYPTO_NOSCRYPT=OFF -DNOSTR_CRYPTO_MBEDTLS=ON

      - name: Confirm the mbedTLS paths are actually enabled
        run: |
          grep -q '^#define HAVE_MBEDTLS' build/include/nostr_features.h \
            || { echo "::error::HAVE_MBEDTLS not defined; this job would test the OpenSSL paths instead" >&2; exit 1; }
          echo "HAVE_MBEDTLS is defined"

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Confirm the binary links mbedTLS
        run: |
          ldd build/tests/test_random | grep -q mbedcrypto \
            || { echo "::error::test_random is not linked against mbedcrypto" >&2; exit 1; }
          ldd build/tests/test_random | grep mbedcrypto

      - name: Test
        run: |
          cd build
          ctest --output-on-failure

  build-esp-idf:
    # Builds third-party sources; no reason to hold a writable job token.
    permissions:
      contents: read
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: libnostr-c

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: privkeyio/noscrypt
          # Commit, not branch: the same revision keep-esp32 pins.
          ref: 45fcbef32f958145d6797f384a225c0d43616886 # esp-idf-support
          path: noscrypt

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: privkeyio/secp256k1-frost
          ref: 746dbbea5c34dde963c9bd55bc7474b2d50fa597 # esp-idf-support
          path: secp256k1-frost

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: libnostr-c/test/esp-idf

      # Building alone is what let three defects reach main: the mbedTLS RNG
      # path compiles only for ESP targets, so until this ran, that code had
      # never executed anywhere. The host mbedTLS job covers the same logic
      # against 2.x; this covers the 3.x ESP-IDF ships, on the FreeRTOS
      # scheduler the data-race case needs.
      #
      # QEMU is driven directly rather than through `idf.py qemu monitor`,
      # which expects an interactive terminal and a TCP serial socket. The
      # `idf.py qemu` call before it is only to generate qemu_flash.bin and
      # qemu_efuse.bin; its own launch attempt is discarded.
      - name: Run the on-target smoke test under QEMU
        working-directory: libnostr-c/test/esp-idf
        run: |
          set -uo pipefail
          # Mounted at the SAME absolute path the build used. CMake caches
          # absolute paths in build/, so mounting elsewhere (e.g. /p) silently
          # invalidates the cache and idf.py regenerates nothing, which surfaces
          # only as a missing flash image.
          docker run --rm -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" -w "$PWD" espressif/idf:v5.4.1 bash -lc '
            set -eu
            # Install errors are NOT discarded: a silent failure here would
            # leave the run looking like a QEMU problem rather than a missing
            # tool. IDF_TOOLS_PATH is /opt/esp in this image, not ~/.espressif,
            # so the tool is located through PATH after export.sh rather than
            # by guessing a directory.
            python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
            . "$IDF_PATH/export.sh" >/dev/null
            command -v qemu-system-xtensa >/dev/null \
              || { echo "qemu-system-xtensa not on PATH after install" >&2; exit 1; }

            # Only to generate qemu_flash.bin and qemu_efuse.bin; its own launch
            # attempt wants an interactive terminal and is discarded.
            # Output kept: when this failed, discarding it left only "flash
            # image was never generated" with no cause.
            timeout 60 idf.py qemu --qemu-extra-args="-nographic" > qemu-gen.log 2>&1 || true
            if [ ! -f build/qemu_flash.bin ]; then
              echo "flash image was never generated; idf.py qemu said:" >&2
              tail -30 qemu-gen.log >&2
              exit 1
            fi

            # -nographic already routes serial to stdio. Passing -serial stdio
            # as well makes the machine boot with no console output at all.
            timeout 90 qemu-system-xtensa -M esp32s3 \
              -drive file=build/qemu_flash.bin,if=mtd,format=raw \
              -drive file=build/qemu_efuse.bin,if=none,format=raw,id=efuse \
              -global driver=nvram.esp32c3.efuse,property=drive,value=efuse \
              -nographic > qemu.log 2>&1 || true
          '
          echo "--- smoke output ---"
          sed -n '/SMOKE-BEGIN/,/SMOKE-\(PASS\|FAIL-TOTAL\)/p' qemu.log || true
          if ! grep -q 'SMOKE-PASS' qemu.log; then
            echo "::error::on-target smoke test did not report SMOKE-PASS (assertion failure, crash, or hang)" >&2
            tail -40 qemu.log >&2
            exit 1
          fi
        
  build-windows:
    # Builds third-party sources; no reason to hold a writable job token.
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    strategy:
      matrix:
        preset: ["win-release"]
        include:
          - preset: "win-release"
            with_vcpkg: false
          # Disabled: slow (~10 min) vcpkg build - uncomment to re-enable
          # - preset: "win-release-vcpkg"
          #   with_vcpkg: true
    
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v1.3
      
      - name: Install vcpkg dependencies
        if: matrix.with_vcpkg
        run: |
          vcpkg install openssl:x64-windows
          vcpkg install cjson:x64-windows
          vcpkg install libwebsockets:x64-windows
          
      - name: Install secp256k1 (vcpkg)
        if: matrix.with_vcpkg
        run: |
          git clone https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1
          git checkout 1a53f4961f337b4d166c25fce72ef0dc88806618 # v0.7.1
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DSECP256K1_ENABLE_MODULE_SCHNORRSIG=ON -DSECP256K1_ENABLE_MODULE_EXTRAKEYS=ON -DCMAKE_INSTALL_PREFIX="C:/vcpkg/installed/x64-windows"
          cmake --build . --config Release
          cmake --install . --config Release

      - name: Install secp256k1 (minimal)
        if: ${{ !matrix.with_vcpkg }}
        run: |
          git clone https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1
          git checkout 1a53f4961f337b4d166c25fce72ef0dc88806618 # v0.7.1
          mkdir build && cd build
          cmake .. -DSECP256K1_ENABLE_MODULE_SCHNORRSIG=ON -DSECP256K1_ENABLE_MODULE_EXTRAKEYS=ON -DCMAKE_INSTALL_PREFIX="C:/Program Files/secp256k1"
          cmake --build . --config Release
          cmake --install . --config Release
          
      - name: Configure using CMake Preset
        run: |
          cmake --preset ${{ matrix.preset }} -DSECP256K1_LIB_DIR="C:/Program Files/secp256k1/lib"
          
      - name: Build using CMake Preset  
        run: |
          cmake --build --preset ${{ matrix.preset }}
          
      - name: Test using CMake Preset
        run: |
          $env:PATH = "C:\Program Files\secp256k1\bin;C:\Program Files\secp256k1\lib;$env:PATH"
          ctest --preset win-release || echo "Tests completed with warnings"
        
  build-macos:
    # Builds third-party sources; no reason to hold a writable job token.
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    runs-on: macos-latest
    name: "macOS ${{ matrix.build_type }} (${{ matrix.noscrypt_name }})"
    strategy:
      matrix:
        build_type: [Debug, Release]
        noscrypt: ["OFF", "ON"]
        include:
          - noscrypt: "OFF"
            noscrypt_name: "secp256k1"
          - noscrypt: "ON"
            noscrypt_name: "noscrypt"
    
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        
      - name: Install dependencies
        run: |
          brew install cmake openssl@3 cjson libwebsockets autoconf automake libtool
          
      - name: Install secp256k1
        run: |
          git clone https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1
          git checkout 1a53f4961f337b4d166c25fce72ef0dc88806618 # v0.7.1
          ./autogen.sh
          ./configure --enable-module-schnorrsig --enable-module-extrakeys --prefix=/usr/local
          make -j$(sysctl -n hw.ncpu)
          sudo make install
          # Ensure library is discoverable
          sudo ldconfig 2>/dev/null || true
          # Create symlink for consistency across different macOS setups
          sudo ln -sf /usr/local/lib/libsecp256k1.dylib /usr/local/lib/libsecp256k1.dylib || true
          
      - name: Build noscrypt (if enabled)
        if: matrix.noscrypt == 'ON'
        run: |
          git clone https://github.com/VnUgE/noscrypt.git
          cd noscrypt
          # Pinned; see the Linux job for why the previous latest-tag lookup was
          # replaced.
          git checkout 04a5c7b4d0151b9105e5afd6bc0e4dd89ac616bc # v0.1.15
          
          chmod +x ../.github/scripts/fix-noscrypt-headers.sh
          ../.github/scripts/fix-noscrypt-headers.sh . 1.1.1
          
          mkdir build && cd build
          echo "Configuring noscrypt..."
          export PKG_CONFIG_PATH="/opt/homebrew/opt/openssl@3/lib/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          
          # Production-grade secp256k1 path detection
          SECP_PATHS="/usr/local/lib:/opt/homebrew/lib:/opt/local/lib"
          for path in $(echo $SECP_PATHS | tr ':' ' '); do
            if [ -f "$path/libsecp256k1.dylib" ] || [ -f "$path/libsecp256k1.a" ]; then
              SECP256K1_PATH="$path"
              echo "Found secp256k1 at: $path"
              break
            fi
          done
          
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/openssl@3;/usr/local;/opt/homebrew;/opt/local" -DSECP256K1_LIB_DIR="${SECP256K1_PATH:-/usr/local/lib}" -DCRYPTO_LIB=openssl -DCMAKE_EXE_LINKER_FLAGS="-L${SECP256K1_PATH:-/usr/local/lib}" -DCMAKE_SHARED_LINKER_FLAGS="-L${SECP256K1_PATH:-/usr/local/lib}"
          echo "Building noscrypt..."
          make -j$(sysctl -n hw.ncpu)
          echo "Installing noscrypt..."
          sudo make install
          echo "Verifying noscrypt installation..."
          pkg-config --exists noscrypt && echo "noscrypt pkg-config found" || echo "noscrypt pkg-config not found"
          ls -la /usr/local/include/noscrypt/ || echo "noscrypt headers not found"
          
      - name: Configure
        run: |
          mkdir build && cd build
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/openssl@3/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LIBRARY_PATH="/usr/local/lib:/opt/homebrew/lib:/opt/homebrew/opt/openssl@3/lib:$LIBRARY_PATH"
          export CPATH="/usr/local/include:/opt/homebrew/include:/opt/homebrew/opt/openssl@3/include:$CPATH"
          # Production-grade secp256k1 path detection
          SECP_PATHS="/usr/local/lib:/opt/homebrew/lib:/opt/local/lib"
          for path in $(echo $SECP_PATHS | tr ':' ' '); do
            if [ -f "$path/libsecp256k1.dylib" ] || [ -f "$path/libsecp256k1.a" ]; then
              SECP256K1_PATH="$path"
              echo "Found secp256k1 at: $path"
              break
            fi
          done
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNOSTR_FEATURE_CRYPTO_NOSCRYPT=${{ matrix.noscrypt }} -DCMAKE_PREFIX_PATH="/usr/local;/opt/homebrew;/opt/homebrew/opt/openssl@3;/opt/local" -DCMAKE_INCLUDE_PATH="/usr/local/include;/opt/homebrew/include;/opt/homebrew/opt/openssl@3/include;/opt/local/include" -DCMAKE_LIBRARY_PATH="/usr/local/lib;/opt/homebrew/lib;/opt/homebrew/opt/openssl@3/lib;/opt/local/lib" -DSECP256K1_LIB_DIR="${SECP256K1_PATH:-/usr/local/lib}"
          
      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)
          
      - name: Test
        run: |
          cd build
          ctest --output-on-failure